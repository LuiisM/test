<article class="dog-preview">
  @for (dog of _dogs; track dog) {
  <mat-card class="dog-preview__card" appearance="outlined">
    <mat-card-header class="dog-preview__header">
      <mat-card-title>{{ selectedBreed }}</mat-card-title>
      <mat-card-subtitle>{{ selectedSubBreed || `&nbsp;` }}</mat-card-subtitle>
    </mat-card-header>
    <img
      class="dog-preview__img"
      mat-card-image
      [src]="dog"
      alt="Photo of a dog"
    />
  </mat-card>
  }
</article>
